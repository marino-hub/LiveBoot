name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.5'
      - name: Create Manifest
        run: |
          python3 -c 'import os; os.makedirs("app/src/main", exist_ok=True); L, R = chr(60), chr(62); open("app/src/main/AndroidManifest.xml", "w").write(f"{L}manifest xmlns:android=\"http://android.com\"{R}{L}application android:label=\"LiveBoot\" android:theme=\"@android:style/Theme.NoTitleBar.Fullscreen\"{R}{L}activity android:name=\".MainActivity\" android:exported=\"true\" android:windowSoftInputMode=\"adjustResize\"{R}{L}intent-filter{R}{L}action android:name=\"android.intent.action.MAIN\"/{R}{L}category android:name=\"android.intent.category.LAUNCHER\"/{R}{L}/intent-filter{R}{L}/activity{R}{L}/application{R}{L}/manifest{R}")'
      - name: Build Debug APK
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: LiveBoot-APK
          path: app/build/outputs/apk/debug/app-debug.apk
